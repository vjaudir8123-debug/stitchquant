[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchquant"
version = "1.0.0"
authors = [
  { name = "StitchQuant Team" }
]
description = "Universal Ultra-Low-Bit Weight Quantization & Dynamic JIT Reconstruction Engine with 100% Verbatim FP16 Precision"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "psutil>=5.9.0",
    "numpy>=1.22.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["stitch_quant*"]
